services:
  - type: web
    name: crosscutter
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: crosscutter-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://crosscutter.onrender.com

databases:
  - name: crosscutter-db
    plan: starter
    databaseName: crosscutter
    user: crosscutter_user